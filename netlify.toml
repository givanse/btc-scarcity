# https://docs.netlify.com/configure-builds/file-based-configuration/#sample-file

[build]
  functions = "functions"
  command = "npm ci && npm run build"
  publish = "dist"
  # Path safety net if auto-prod remains. Fail-open script; not `exit 0`.
  # Resolves from NETLIFY_REPO_PATH / git root so a leftover UI base dir still works.
  ignore = "bash \"${NETLIFY_REPO_PATH:-$(git rev-parse --show-toplevel)}/scripts/netlify-ignore.sh\""

# skip_prs is already true in the Netlify UI. Belt-and-suspenders: never DP.
[context.deploy-preview]
  ignore = "exit 0"

[context.production.environment]
  NODE_ENV = "production"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# The following redirect is intended for use with most SPAs that handle
# routing internally.
# Do not force this rewrite: /api/* and function routes must stay shadowed.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200