# https://docs.netlify.com/configure-builds/file-based-configuration/#sample-file

[build]
  functions = "functions"
  command = "npm ci && npm run build"
  publish = "dist"
  # Path safety net if a git-triggered prod build still runs. Fail-open; not `exit 0`.
  # Honor base dir via NETLIFY_REPO_PATH / git root. Ship with `netlify deploy --prod`.
  ignore = "bash \"${NETLIFY_REPO_PATH:-$(git rev-parse --show-toplevel)}/scripts/netlify-ignore.sh\""

# skip_prs is already true. Belt-and-suspenders: never DP. stop_builds stays false.
[context.deploy-preview]
  ignore = "exit 0"

[context.production.environment]
  NODE_ENV = "production"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# The following redirect is intended for use with most SPAs that handle
# routing internally. This app does not: state lives in query strings
# (`?btc=&fiat=&loc=`), so a `/*` → `/index.html` 200 rewrite is unused.
# Do not force this rewrite: /api/* and function routes must stay shadowed.
# Without it, scanner paths (wp-admin, wp-login.php, wordpress, wp-json,
# .git/config, /blog/, /wp/) get a real 404 instead of the app as a page view.
